name: Đồng bộ sổ cái vào main

# Phiên Claude Code in the cloud chỉ được đẩy lên nhánh claude/... của nó.
# Workflow này (scripts/sync_branch.py):
#   - LUÔN đưa phần sổ cái của nhánh vào main, kể cả khi nhánh có sửa file khác
#     (events.jsonl chỉ ghi thêm dòng mới, không trùng, không mất);
#   - chép phần ngoài sổ cái (hiến pháp, agent, script...) sang nhánh review/<nhánh>
#     và mở pull request chờ Capu duyệt. PR đó chỉ chứa phần cần duyệt.

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ledger-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Đồng bộ
        id: sync
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch -q origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          python3 scripts/sync_branch.py --branch "$BRANCH"

      - name: Mở pull request cho phần cần Capu duyệt
        if: steps.sync.outputs.review_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ steps.sync.outputs.review_branch }}
          BRANCH: ${{ github.ref_name }}
          FILES: ${{ steps.sync.outputs.outside_files }}
        run: |
          if gh pr list --head "$REVIEW" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Pull request cho $REVIEW đã có, đã được cập nhật."
          else
            gh pr create --base main --head "$REVIEW" \
              --title "Cần Capu duyệt: thay đổi ngoài sổ cái từ $BRANCH" \
              --body "Agent đã sửa các file ngoài sổ cái: ${FILES//,/, }. Sổ cái của nhánh đã được đồng bộ vào main; PR này chỉ chứa phần cần anh duyệt."
          fi
