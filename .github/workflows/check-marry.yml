# Kiểm marry.vn còn trả ảnh không (nguồn ảnh vendor, ADR-021 / T-051).
# Xanh = marry.vn trả ảnh; đỏ = sập hoặc treo. Chief of Staff đọc kết quả mỗi ngày.
name: Check marry.vn

on:
  schedule:
    - cron: "43 0 * * *" # 07:43 giờ Việt Nam
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Thử tải 3 ảnh mẫu
        run: |
          ok=0
          for u in \
            "https://www.marry.vn/images/detailed/430/z3408678245110_c284c224e1dc6376152235dd43535cb1.jpg" \
            "https://www.marry.vn/images/detailed/113/0000911-nc24f.jpeg" \
            "https://www.marry.vn/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A "Mozilla/5.0 (tohong-check)" "$u" || echo 000)
            echo "$code $u" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] && ok=$((ok+1))
          done
          echo "ok=$ok/3" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$ok" -ge 2 ] || { echo "::error::marry.vn chưa trả ảnh (ok=$ok/3)"; exit 1; }
